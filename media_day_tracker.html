<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Media Day Tracker 26–27</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --maroon: #7B1C2E; --maroon-light: #9B2D42; --gold: #C9A84C; --gold-light: #E8C96A;
    --dark: #1A1A1A; --surface: #FAFAFA; --card: #FFFFFF; --border: #E5E5E5;
    --muted: #6B7280; --text: #111827;
    --senior: #7B1C2E; --junior: #9B59B6; --sophomore: #2563EB; --freshman: #059669;
  }
  body { font-family: 'Inter', sans-serif; background: var(--surface); color: var(--text); min-height: 100vh; }

  .header { background: linear-gradient(135deg, var(--maroon) 0%, #4A0E1A 100%); padding: 28px 32px 20px; position: relative; overflow: hidden; }
  .header::before { content: '★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★'; position: absolute; top: 8px; left: 0; right: 0; text-align: center; color: rgba(201,168,76,0.3); font-size: 10px; letter-spacing: 6px; }
  .header::after { content: '★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★ ★'; position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; color: rgba(201,168,76,0.3); font-size: 10px; letter-spacing: 6px; }
  .header-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .header-title-group { display: flex; align-items: center; gap: 16px; }
  .megaphone { font-size: 36px; }
  .header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 42px; letter-spacing: 3px; color: #fff; line-height: 1; }
  .header h1 span { color: var(--gold); }
  .header-sub { font-size: 12px; color: rgba(255,255,255,0.6); letter-spacing: 2px; text-transform: uppercase; margin-top: 4px; }
  .header-stats { display: flex; gap: 24px; }
  .stat-pill { text-align: center; background: rgba(255,255,255,0.1); border: 1px solid rgba(201,168,76,0.3); border-radius: 10px; padding: 8px 16px; }
  .stat-pill .num { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); line-height: 1; }
  .stat-pill .label { font-size: 10px; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: 1px; }

  .games-bar { background: var(--maroon-light); padding: 0 32px; }
  .games-bar-inner { max-width: 1100px; margin: 0 auto; display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; }
  .games-bar-inner::-webkit-scrollbar { display: none; }
  .game-tab { padding: 10px 20px; color: rgba(255,255,255,0.65); font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; transition: all 0.15s; user-select: none; }
  .game-tab:hover { color: rgba(255,255,255,0.9); }
  .game-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  .toolbar { max-width: 1100px; margin: 20px auto 0; padding: 0 32px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .toolbar-left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex: 1; }
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  input[type="text"].search { padding: 8px 12px 8px 34px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; width: 200px; background: #fff; outline: none; transition: border-color 0.15s; }
  input[type="text"].search:focus { border-color: var(--maroon); }
  select.filter-select { padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; background: #fff; outline: none; cursor: pointer; color: var(--text); }
  select.filter-select:focus { border-color: var(--maroon); }
  .btn { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; border: none; transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--maroon); color: #fff; }
  .btn-primary:hover { background: var(--maroon-light); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
  .btn-ghost:hover { border-color: var(--maroon); color: var(--maroon); }

  .banner { max-width: 1100px; margin: 16px auto 0; padding: 0 32px; }
  .banner-inner { background: linear-gradient(135deg, #FFF8E7, #FEF3C7); border: 1.5px solid var(--gold); border-radius: 10px; padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; }
  .banner-inner .icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
  .banner-text { font-size: 12.5px; color: #78350F; line-height: 1.6; }
  .banner-text strong { font-weight: 700; }

  .table-wrap { max-width: 1100px; margin: 16px auto 32px; padding: 0 32px; }
  .table-card { background: var(--card); border-radius: 14px; border: 1.5px solid var(--border); overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  table { width: 100%; border-collapse: collapse; }
  thead { background: linear-gradient(135deg, #1A1A1A, #2D2D2D); }
  thead th { padding: 12px 14px; text-align: left; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: rgba(255,255,255,0.7); white-space: nowrap; }
  .col-actions { width: 90px; text-align: center !important; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #F9FAFB; }
  tbody tr.editing { background: #FFFBEB; }
  td { padding: 10px 14px; font-size: 13.5px; vertical-align: middle; }

  .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; }
  .badge-senior { background: #FEE2E2; color: var(--senior); }
  .badge-junior { background: #F3E8FF; color: var(--junior); }
  .badge-sophomore { background: #DBEAFE; color: var(--sophomore); }
  .badge-freshman { background: #D1FAE5; color: var(--freshman); }

  .holiday-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; background: #F3F4F6; color: #374151; white-space: nowrap; }

  .game-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 8px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .game-maroon { background: #FEE2E2; color: var(--maroon); }
  .game-western { background: #FEF3C7; color: #92400E; }
  .game-homecoming { background: #EDE9FE; color: #4C1D95; }
  .game-military { background: #D1FAE5; color: #064E3B; }
  .game-senior { background: #FEE2E2; color: #7F1D1D; }

  td input[type="text"].edit-field, td select.edit-field {
    width: 100%; padding: 5px 8px; border: 1.5px solid var(--gold); border-radius: 6px;
    font-size: 13px; font-family: 'Inter', sans-serif; background: #FFFDF5; outline: none;
  }
  td select.edit-field[multiple] { height: auto; }

  .action-btns { display: flex; gap: 6px; justify-content: center; }
  .icon-btn { width: 30px; height: 30px; border-radius: 6px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: all 0.12s; }
  .edit-btn { background: #EEF2FF; color: #3730A3; }
  .edit-btn:hover { background: #C7D2FE; }
  .save-btn { background: #D1FAE5; color: #065F46; }
  .save-btn:hover { background: #A7F3D0; }
  .del-btn { background: #FEE2E2; color: #991B1B; }
  .del-btn:hover { background: #FECACA; }
  .cancel-btn { background: #F3F4F6; color: #4B5563; }
  .cancel-btn:hover { background: #E5E7EB; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal { background: #fff; border-radius: 16px; padding: 28px; width: 100%; max-width: 520px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .modal h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: var(--maroon); margin-bottom: 20px; }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
  .form-row input, .form-row select { width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13.5px; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.15s; }
  .form-row input:focus, .form-row select:focus { border-color: var(--maroon); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  .empty-state { padding: 48px 20px; text-align: center; color: var(--muted); }
  .empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  .notes-section { max-width: 1100px; margin: 0 auto 32px; padding: 0 32px; }
  .notes-card { background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .notes-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1.5px; color: var(--maroon); margin-bottom: 12px; }
  textarea.notes-field { width: 100%; min-height: 90px; border: 1.5px solid var(--border); border-radius: 8px; padding: 10px 12px; font-family: 'Inter', sans-serif; font-size: 13px; resize: vertical; outline: none; transition: border-color 0.15s; color: var(--text); line-height: 1.6; }
  textarea.notes-field:focus { border-color: var(--maroon); }

  @media (max-width: 700px) {
    .header { padding: 20px 16px 16px; }
    .toolbar, .banner, .table-wrap, .notes-section { padding: 0 16px; }
    .header h1 { font-size: 28px; }
    .header-stats { gap: 12px; }
    .stat-pill .num { font-size: 22px; }
    input[type="text"].search { width: 150px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
const HOLIDAY_EMOJIS = {
  "Winter Break": "❄️", "New Year's": "🎆", "Halloween": "🎃", "Labor Day": "🛠️",
  "Thanksgiving": "🦃", "St. Patrick's Day": "☘️", "Exam Day/Finals": "📚",
  "Valentine's Day": "💝", "Spring Break/Summer Break": "☀️", "4th of July": "🎇",
  "Christmas/Winter Break": "🎄"
};
const HOLIDAYS = Object.keys(HOLIDAY_EMOJIS);
const GAME_DAYS = [
  { label: "Sept 6 – Maroon Out", key: "Maroon Out", cls: "game-maroon", emoji: "🔴" },
  { label: "Sept 27 – Family/Western", key: "Western", cls: "game-western", emoji: "🤠" },
  { label: "Oct 11 – Homecoming", key: "Homecoming", cls: "game-homecoming", emoji: "🏆" },
  { label: "Nov 8 – Military Appreciation", key: "Military Appreciation", cls: "game-military", emoji: "🎖️" },
  { label: "Nov 22 – Senior Day", key: "Senior Day", cls: "game-senior", emoji: "⭐" },
];
const YEARS = ["Senior", "Junior", "Sophomore", "Freshman"];

let members = [
  { id: 1, name: "Lily Cohen", year: "Senior", holidays: ["Halloween", "Christmas/Winter Break"], gameDay: "Homecoming" },
  { id: 2, name: "Charlotte Todd", year: "Senior", holidays: ["New Year's"], gameDay: "Homecoming" },
  { id: 3, name: "Maleah P", year: "Senior", holidays: ["Exam Day/Finals"], gameDay: "Homecoming" },
  { id: 4, name: "Bella D", year: "Junior", holidays: ["St. Patrick's Day"], gameDay: "Homecoming" },
  { id: 5, name: "Sasha H", year: "Junior", holidays: ["Valentine's Day"], gameDay: "Homecoming" },
  { id: 6, name: "Catie M", year: "Junior", holidays: ["4th of July"], gameDay: "Homecoming" },
  { id: 7, name: "Loren P", year: "Junior", holidays: ["Spring Break/Summer Break"], gameDay: "Western" },
  { id: 8, name: "Jordan S", year: "Sophomore", holidays: ["4th of July", "Exam Day/Finals"], gameDay: "Western" },
  { id: 9, name: "Ethan R", year: "Sophomore", holidays: ["Spring Break/Summer Break"], gameDay: "Western" },
  { id: 10, name: "Kate L", year: "Sophomore", holidays: ["Halloween"], gameDay: "Western" },
  { id: 11, name: "Charlotte M", year: "Sophomore", holidays: ["Valentine's Day", "Christmas/Winter Break"], gameDay: "Western" },
  { id: 12, name: "Gray N", year: "Sophomore", holidays: ["Halloween"], gameDay: "Western" },
  { id: 13, name: "Naomi S", year: "Sophomore", holidays: ["Labor Day"], gameDay: "Western" },
  { id: 14, name: "Jeffery W", year: "Sophomore", holidays: ["New Year's"], gameDay: "Military Appreciation" },
  { id: 15, name: "Olivia B", year: "Sophomore", holidays: ["Labor Day"], gameDay: "Military Appreciation" },
  { id: 16, name: "Sasha R", year: "Sophomore", holidays: ["Thanksgiving"], gameDay: "Military Appreciation" },
  { id: 17, name: "Lily N", year: "Sophomore", holidays: ["St. Patrick's Day"], gameDay: "Military Appreciation" },
  { id: 18, name: "Ava F", year: "Sophomore", holidays: ["New Year's"], gameDay: "Military Appreciation" },
  { id: 19, name: "Reily Grace W", year: "Sophomore", holidays: ["Exam Day/Finals"], gameDay: "Military Appreciation" },
  { id: 20, name: "Bilal T", year: "Sophomore", holidays: ["Thanksgiving"], gameDay: "Military Appreciation" },
  { id: 21, name: "Sophia T", year: "Sophomore", holidays: ["Spring Break/Summer Break"], gameDay: "Maroon Out" },
  { id: 22, name: "Leah L", year: "Freshman", holidays: ["Halloween"], gameDay: "Maroon Out" },
  { id: 23, name: "Emmary C", year: "Freshman", holidays: ["St. Patrick's Day"], gameDay: "Maroon Out" },
  { id: 24, name: "Addison S", year: "Freshman", holidays: ["4th of July", "Christmas/Winter Break"], gameDay: "Maroon Out" },
  { id: 25, name: "Lauren W", year: "Freshman", holidays: ["Thanksgiving"], gameDay: "Maroon Out" },
  { id: 26, name: "Kaitlyn K", year: "Freshman", holidays: ["Labor Day"], gameDay: "Maroon Out" },
  { id: 27, name: "Lucy Bennett", year: "Freshman", holidays: ["Valentine's Day"], gameDay: "Maroon Out" },
];

let nextId = 28;
let editingId = null;
let editData = {};
let activeTab = "All";
let searchQ = "";
let yearFilter = "All";
let showModal = false;
let newMember = { name: "", year: "Senior", holidays: [], gameDay: "Homecoming" };
let notes = "Reminder: everyone must wear cheer uniform + bring add-ons. Check the Insta for inspiration!\n\nSenior Day (Nov 22): seniors photo only 📸";

function yearClass(year) {
  return { Senior: "badge-senior", Junior: "badge-junior", Sophomore: "badge-sophomore", Freshman: "badge-freshman" }[year] || "badge-freshman";
}
function gameClass(gd) { return (GAME_DAYS.find(x => x.key === gd) || {}).cls || "game-maroon"; }
function gameEmoji(gd) { return (GAME_DAYS.find(x => x.key === gd) || {}).emoji || "🏈"; }

function filteredMembers() {
  return members.filter(m => {
    const matchTab = activeTab === "All" || m.gameDay === activeTab;
    const matchYear = yearFilter === "All" || m.year === yearFilter;
    const q = searchQ.toLowerCase();
    const matchSearch = !q || m.name.toLowerCase().includes(q) || m.holidays.some(h => h.toLowerCase().includes(q));
    return matchTab && matchYear && matchSearch;
  });
}

function render() {
  const filtered = filteredMembers();
  const gameCounts = {};
  GAME_DAYS.forEach(g => gameCounts[g.key] = members.filter(m => m.gameDay === g.key).length);

  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="header-inner">
        <div class="header-title-group">
          <div class="megaphone">📣</div>
          <div>
            <h1>MEDIA <span>DAY</span> '26–'27</h1>
            <div class="header-sub">Cheer Squad · Spirit Assignment Tracker</div>
          </div>
        </div>
        <div class="header-stats">
          <div class="stat-pill"><div class="num">${members.length}</div><div class="label">Members</div></div>
          <div class="stat-pill"><div class="num">${members.filter(m=>m.year==='Senior').length}</div><div class="label">Seniors</div></div>
          <div class="stat-pill"><div class="num">${HOLIDAYS.length}</div><div class="label">Holidays</div></div>
        </div>
      </div>
    </div>

    <div class="games-bar">
      <div class="games-bar-inner">
        <div class="game-tab ${activeTab==='All'?'active':''}" onclick="setTab('All')">All Games</div>
        ${GAME_DAYS.map(g=>`<div class="game-tab ${activeTab===g.key?'active':''}" onclick="setTab('${g.key}')">${g.emoji} ${g.label.split('–')[1]?.trim()||g.key} <span style="opacity:.6;font-size:10px">(${gameCounts[g.key]})</span></div>`).join('')}
      </div>
    </div>

    <div class="banner">
      <div class="banner-inner">
        <div class="icon">📋</div>
        <div class="banner-text"><strong>How to use:</strong> Click ✏️ to edit any row · Click 🗑️ to remove · Use <strong>+ Add Member</strong> to add new entries · Filter by game day or year using the controls above</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-wrap">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" class="search" placeholder="Search name or holiday…" value="${escHtml(searchQ)}" oninput="setSearch(this.value)"/>
        </div>
        <select class="filter-select" onchange="setYearFilter(this.value)">
          <option value="All" ${yearFilter==='All'?'selected':''}>All Years</option>
          ${YEARS.map(y=>`<option value="${y}" ${yearFilter===y?'selected':''}>${y}s</option>`).join('')}
        </select>
      </div>
      <button class="btn btn-primary" onclick="openModal()">＋ Add Member</button>
    </div>

    <div class="table-wrap">
      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>#</th><th>Name</th><th>Year</th><th>Holiday Theme(s)</th><th>Game Day</th>
              <th class="col-actions">Actions</th>
            </tr>
          </thead>
          <tbody>
            ${filtered.length === 0
              ? `<tr><td colspan="6"><div class="empty-state"><div class="empty-icon">🔍</div><p>No members match your filters.</p></div></td></tr>`
              : filtered.map((m, i) => renderRow(m, i + 1)).join('')}
          </tbody>
        </table>
      </div>
    </div>

    <div class="notes-section">
      <div class="notes-card">
        <div class="notes-title">📝 Team Notes</div>
        <textarea class="notes-field" oninput="notes=this.value" placeholder="Add notes, reminders, or instructions…">${escHtml(notes)}</textarea>
      </div>
    </div>

    ${showModal ? renderModal() : ''}
  `;
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderRow(m, idx) {
  if (editingId === m.id) {
    return `<tr class="editing">
      <td style="color:var(--muted);font-size:12px">${idx}</td>
      <td><input type="text" class="edit-field" id="ef-name" value="${escHtml(editData.name)}"/></td>
      <td>
        <select class="edit-field" id="ef-year">
          ${YEARS.map(y=>`<option value="${y}" ${editData.year===y?'selected':''}>${y}</option>`).join('')}
        </select>
      </td>
      <td>
        <select class="edit-field" id="ef-holidays" multiple size="4">
          ${HOLIDAYS.map(h=>`<option value="${h}" ${editData.holidays.includes(h)?'selected':''}>${HOLIDAY_EMOJIS[h]} ${h}</option>`).join('')}
        </select>
        <div style="font-size:10px;color:var(--muted);margin-top:3px">Hold Ctrl/Cmd to multi-select</div>
      </td>
      <td>
        <select class="edit-field" id="ef-game">
          ${GAME_DAYS.map(g=>`<option value="${g.key}" ${editData.gameDay===g.key?'selected':''}>${g.emoji} ${g.key}</option>`).join('')}
        </select>
      </td>
      <td class="col-actions">
        <div class="action-btns">
          <button class="icon-btn save-btn" onclick="saveEdit(${m.id})" title="Save">✓</button>
          <button class="icon-btn cancel-btn" onclick="cancelEdit()" title="Cancel">✕</button>
        </div>
      </td>
    </tr>`;
  }
  const chips = m.holidays.map(h=>`<span class="chip">${HOLIDAY_EMOJIS[h]||'🎉'} ${h}</span>`).join('');
  return `<tr>
    <td style="color:var(--muted);font-size:12px;font-weight:600">${idx}</td>
    <td style="font-weight:600">${escHtml(m.name)}</td>
    <td><span class="badge ${yearClass(m.year)}">${m.year}</span></td>
    <td><div class="holiday-chips">${chips}</div></td>
    <td><span class="game-chip ${gameClass(m.gameDay)}">${gameEmoji(m.gameDay)} ${m.gameDay}</span></td>
    <td class="col-actions">
      <div class="action-btns">
        <button class="icon-btn edit-btn" onclick="startEdit(${m.id})" title="Edit">✏️</button>
        <button class="icon-btn del-btn" onclick="deleteMember(${m.id})" title="Delete">🗑️</button>
      </div>
    </td>
  </tr>`;
}

function renderModal() {
  return `<div class="modal-overlay" id="modal-overlay" onclick="closeModalIfBg(event)">
    <div class="modal">
      <h2>➕ Add New Member</h2>
      <div class="form-row">
        <label>Name</label>
        <input type="text" id="m-name" placeholder="First Last" value="${escHtml(newMember.name)}"/>
      </div>
      <div class="form-row">
        <label>Year</label>
        <select id="m-year">
          ${YEARS.map(y=>`<option value="${y}" ${newMember.year===y?'selected':''}>${y}</option>`).join('')}
        </select>
      </div>
      <div class="form-row">
        <label>Holiday Theme(s) <span style="font-weight:400;text-transform:none">(hold Ctrl/Cmd for multiple)</span></label>
        <select id="m-holidays" multiple size="6">
          ${HOLIDAYS.map(h=>`<option value="${h}" ${newMember.holidays.includes(h)?'selected':''}>${HOLIDAY_EMOJIS[h]} ${h}</option>`).join('')}
        </select>
      </div>
      <div class="form-row">
        <label>Game Day Assignment</label>
        <select id="m-game">
          ${GAME_DAYS.map(g=>`<option value="${g.key}" ${newMember.gameDay===g.key?'selected':''}>${g.emoji} ${g.label}</option>`).join('')}
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="addMember()">Add to Roster</button>
      </div>
    </div>
  </div>`;
}

function setTab(t) { activeTab = t; render(); }
function setSearch(v) { searchQ = v; render(); }
function setYearFilter(v) { yearFilter = v; render(); }
function openModal() { showModal = true; newMember = { name:"", year:"Senior", holidays:[], gameDay:"Homecoming" }; render(); }
function closeModal() { showModal = false; render(); }
function closeModalIfBg(e) { if (e.target.id === 'modal-overlay') closeModal(); }

function startEdit(id) {
  const m = members.find(x => x.id === id);
  editingId = id;
  editData = { name: m.name, year: m.year, holidays: [...m.holidays], gameDay: m.gameDay };
  render();
}
function saveEdit(id) {
  editData.name = document.getElementById('ef-name').value;
  editData.year = document.getElementById('ef-year').value;
  editData.holidays = Array.from(document.getElementById('ef-holidays').selectedOptions).map(o => o.value);
  editData.gameDay = document.getElementById('ef-game').value;
  const idx = members.findIndex(x => x.id === id);
  if (idx >= 0) members[idx] = { ...members[idx], ...editData };
  editingId = null;
  render();
}
function cancelEdit() { editingId = null; render(); }
function deleteMember(id) {
  if (confirm('Remove this member from the roster?')) { members = members.filter(m => m.id !== id); render(); }
}
function addMember() {
  const name = document.getElementById('m-name').value.trim();
  const year = document.getElementById('m-year').value;
  const holidays = Array.from(document.getElementById('m-holidays').selectedOptions).map(o => o.value);
  const gameDay = document.getElementById('m-game').value;
  if (!name) { alert('Please enter a name.'); return; }
  if (holidays.length === 0) { alert('Please select at least one holiday theme.'); return; }
  members.push({ id: nextId++, name, year, holidays, gameDay });
  showModal = false;
  render();
}

render();
</script>
</body>
</html>
